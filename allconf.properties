# =====================================================================
# IMPORTANT: keep every key and value in this file ASCII-only.
# Values such as data.path / table names / db user / password / url are
# copied into l2o.properties and config.properties, which are read by
# tableMigration.jar and InsertIntoOracle.jar via
# Properties.load(InputStream) -- always decoded as ISO-8859-1.
# Non-ASCII values are silently corrupted there.
# Comments are skipped by the parser, but keep them in English as well:
# IDEs open .properties files as ISO-8859-1 by default.
# =====================================================================

# install ivory database script file path
# only support install ivory
scriptPath=/storeone/ivoryTest
mount.path=/storeone/ivorydata
X86_PACKAGE=IvorySQL-5.3-4dfba1d-20260312.x86_64.rpm
ARM_PACKAGE=IvorySQL-5.3-4dfba1d-20260312.aarch64.rpm


# PostgreSQL
pgdb.driver=org.postgresql.Driver
pgdb.url=jdbc:postgresql://{host}:{port}/{database}
pgdb.host=127.0.0.1
pgdb.port=5432
pgdb.user=mycat
pgdb.password=mycat
pgdb.database=pgsql

# Ivory
ivory.driver=org.postgresql.Driver
ivory.url=jdbc:postgresql://{host}:{port}/{database}
ivory.host=192.192.190.210
ivory.port=5966
ivory.user=mycat
ivory.password=mycat
ivory.database=ivorysql

# HighGo
highgo.driver=com.highgo.jdbc.Driver
highgo.url=jdbc:highgo://{host}:{port}/{database}
highgo.host=192.168.11.128
highgo.port=5866
highgo.user=mycat
highgo.password=mycat
highgo.database=highgo

# Vastbase
vastdata.driver=org.postgresql.Driver
vastdata.url=jdbc:postgresql://{host}:{port}/{database}
vastdata.host=127.0.0.1
vastdata.port=5432
vastdata.user=mycat
vastdata.password=mycat
vastdata.database=vastbase

# Kingbase
kingbase.driver=com.kingbase8.Driver
kingbase.url=jdbc:kingbase8://{host}:{port}/{database}
kingbase.host=192.192.190.210
kingbase.port=54321
kingbase.user=mycat
kingbase.password=mycat
kingbase.database=test


#dbTypes = {"pgdb", "ivory", "highgo", "vastdata","kingbase"}
db.type=kingbase

# generate test data
mockdata.start_date=2025-01-01
mockdata.months=12
mockdata.file.num=365

# test data path
data.path=/storeone/TestControllerData/datafile

# partition Info
partition.table_name=tb_part_2025
partition.start_date=2025-01-01
partition.end_date=2026-01-01

# copy Info
copy.thread.num=4
copy.file.num=365


# index Info
index.name.1=idx_usernum_
index.name.2=idx_imei_
index.name.3=idx_imsi_
index.name.4=idx_lai_ci_


# Scenario3 read times(h)
timeout.read.hour=2

#
insert.tablename=tb_evt_i
insert.indexname=idx_usernum_
insert.thread.num=10
insert.file.num=15

# Scenario5
binfaInsert.file.num=150
timeout.binfa.hour=5

# monitor iostat/dstat
monitorInterval.60=60
monitorInterval.600=600

# ture|false
is.install.ivory=false
# disk/Raid pre-check switch, default false (skip check).
# requires /opt/MegaRAID/storcli/storcli64; program exits when storcli is unavailable.
# set true on MegaRAID machines to enable the check.
hardware.check.enabled=false
# is generate test data?
scene.mock.enabled=false
scene.createPartition.enabled=false
scene1.enabled=false
scene2.enabled=false
scene3.enabled=false
scene4.enabled=false
scene5.enabled=false


# gbase test
GBbase8s.read.enabled=false
GBbase8s.readAndinsert.enabled=false
